<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

    <!-- Barra de navegación con Grid Bootstrap -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="clientes.html" th:href="@{/clientes}">Gestión Ventas & Tienda</a>
            <ul class="navbar-nav d-flex flex-row gap-3">
                <li class="nav-item">
                    <a class="nav-link active fw-bold" href="clientes.html" th:href="@{/clientes}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="comerciales.html" th:href="@{/comerciales}">Comerciales</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="fabricantes.html" th:href="@{/fabricantes}">Fabricantes</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenedor formulario con grid Bootstrap -->
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 800px;">
        <form action="clientes.html" th:action="@{/clientes/editar/__${cliente.id}__}" th:object="${cliente}" method="post">

            <!-- Cabecera en Grid -->
            <div class="row align-items-center py-3 border-bottom mb-4">
                <div class="col-8">
                    <h1 class="h3 mb-0 text-primary">Editar Cliente</h1>
                </div>
                <div class="col-4 text-end">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="clientes.html" th:href="@{/clientes}" class="btn btn-secondary ms-1">Volver</a>
                </div>
            </div>

            <!-- Campos del formulario con grid Bootstrap (row y col-sm-*) -->
            <div class="row mb-3 align-items-center">
                <label for="id" class="col-sm-3 col-form-label fw-bold">ID</label>
                <div class="col-sm-9">
                    <input type="text" id="id" class="form-control-plaintext bg-light border rounded px-3" name="id" th:field="*{id}" value="1" readonly="readonly"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="nombre" class="col-sm-3 col-form-label fw-bold">Nombre</label>
                <div class="col-sm-9">
                    <input type="text" id="nombre" class="form-control" name="nombre" th:field="*{nombre}" value="Aarón" required="required"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="apellido1" class="col-sm-3 col-form-label fw-bold">Primer Apellido</label>
                <div class="col-sm-9">
                    <input type="text" id="apellido1" class="form-control" name="apellido1" th:field="*{apellido1}" value="Rivero" required="required"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="apellido2" class="col-sm-3 col-form-label fw-bold">Segundo Apellido</label>
                <div class="col-sm-9">
                    <input type="text" id="apellido2" class="form-control" name="apellido2" th:field="*{apellido2}" value="Gómez"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="ciudad" class="col-sm-3 col-form-label fw-bold">Ciudad</label>
                <div class="col-sm-9">
                    <input type="text" id="ciudad" class="form-control" name="ciudad" th:field="*{ciudad}" value="Almería"/>
                </div>
            </div>

            <div class="row mb-4 align-items-center">
                <label for="categoria" class="col-sm-3 col-form-label fw-bold">Categoría</label>
                <div class="col-sm-9">
                    <input type="number" id="categoria" class="form-control" name="categoria" th:field="*{categoria}" value="100"/>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-9 offset-sm-3">
                    <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                    <a href="clientes.html" th:href="@{/clientes}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                </div>
            </div>

        </form>
    </div>

</body>
</html>
