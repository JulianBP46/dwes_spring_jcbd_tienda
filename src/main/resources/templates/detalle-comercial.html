<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Comercial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Gestión Ventas & Tienda</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" th:href="@{/comerciales}">Comerciales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/fabricantes}">Fabricantes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor detalle con grid Bootstrap -->
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 800px;">
        
        <!-- Cabecera con Bootstrap Grid -->
        <div class="row align-items-center py-3 border-bottom mb-4">
            <div class="col-6">
                <h1 class="h3 mb-0 text-success">Detalle de Comercial</h1>
            </div>
            <div class="col-6 text-end">
                <a th:href="@{/comerciales}" class="btn btn-secondary">Volver al listado</a>
                <a th:href="@{/comerciales/editar/__${comercial.id}__}" class="btn btn-primary ms-1">Editar</a>
            </div>
        </div>

        <!-- Campos de detalle con grid Bootstrap (row y col-sm-*) -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 fw-bold text-secondary">ID</div>
            <div class="col-sm-9">
                <input class="form-control-plaintext bg-light border rounded px-3" th:value="${comercial.id}" readonly="readonly"/>
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 fw-bold text-secondary">Nombre</div>
            <div class="col-sm-9">
                <input class="form-control-plaintext bg-light border rounded px-3" th:value="${comercial.nombre}" readonly="readonly"/>
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 fw-bold text-secondary">Primer Apellido</div>
            <div class="col-sm-9">
                <input class="form-control-plaintext bg-light border rounded px-3" th:value="${comercial.apellido1}" readonly="readonly"/>
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 fw-bold text-secondary">Segundo Apellido</div>
            <div class="col-sm-9">
                <input class="form-control-plaintext bg-light border rounded px-3" th:value="${comercial.apellido2 != null ? comercial.apellido2 : '-'}" readonly="readonly"/>
            </div>
        </div>

        <div class="row mb-4 align-items-center">
            <div class="col-sm-3 fw-bold text-secondary">Comisión</div>
            <div class="col-sm-9">
                <input class="form-control-plaintext bg-light border rounded px-3" th:value="${comercial.comision != null ? #numbers.formatDecimal(comercial.comision, 1, 2) : '-'}" readonly="readonly"/>
            </div>
        </div>

        <div class="row border-top pt-3">
            <div class="col-12 text-end">
                <form th:action="@{/comerciales/borrar/__${comercial.id}__}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger">Eliminar este comercial</button>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
