<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <!-- Bootstrap CSS Grid -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Gestión Ventas & Tienda</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" th:href="@{/clientes}">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/comerciales}">Comerciales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/fabricantes}">Fabricantes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal con grid Bootstrap -->
    <div class="container bg-white p-4 rounded shadow-sm">
        
        <!-- Fila de cabecera con título y botón de crear (Grid Bootstrap) -->
        <div class="row align-items-center py-3 border-bottom mb-3">
            <div class="col-md-6 col-12">
                <h1 class="h2 mb-0 text-primary">Clientes</h1>
            </div>
            <div class="col-md-6 col-12 text-md-end text-start mt-2 mt-md-0">
                <a th:href="@{/clientes/crear}" class="btn btn-primary">Crear Cliente</a>
            </div>
        </div>

        <!-- Fila cabecera de la tabla / grid (Bootstrap Grid) -->
        <div class="row border-bottom py-2 fw-bold bg-light text-secondary">
            <div class="col-1">ID</div>
            <div class="col-2">Nombre</div>
            <div class="col-2">1º Apellido</div>
            <div class="col-2">2º Apellido</div>
            <div class="col-2">Ciudad</div>
            <div class="col-1">Categoría</div>
            <div class="col-2 text-center">Acción</div>
        </div>

        <!-- Filas de datos usando th:each en el Grid Bootstrap -->
        <div class="row border-bottom py-2 align-items-center" th:each="cliente : ${listaClientes}">
            <div class="col-1 fw-semibold" th:text="${cliente.id}">1</div>
            <div class="col-2" th:text="${cliente.nombre}">Nombre</div>
            <div class="col-2" th:text="${cliente.apellido1}">Apellido1</div>
            <div class="col-2 text-muted" th:text="${cliente.apellido2 != null ? cliente.apellido2 : '-'}">Apellido2</div>
            <div class="col-2" th:text="${cliente.ciudad != null ? cliente.ciudad : '-'}">Ciudad</div>
            <div class="col-1" th:text="${cliente.categoria != null ? cliente.categoria : '-'}">Categoría</div>
            <div class="col-2 text-center">
                <div class="d-flex justify-content-center gap-1">
                    <a th:href="@{/clientes/__${cliente.id}__}" class="btn btn-success btn-sm">Ver Detalle</a>
                    <a th:href="@{/clientes/editar/__${cliente.id}__}" class="btn btn-primary btn-sm">Editar</a>
                    <form th:action="@{/clientes/borrar/__${cliente.id}__}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Mensaje si la lista está vacía -->
        <div class="row py-4 text-center text-muted" th:if="${#lists.isEmpty(listaClientes)}">
            <div class="col-12">No hay clientes registrados actualmente.</div>
        </div>

    </div>

</body>
</html>
