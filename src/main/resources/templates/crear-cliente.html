<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Gestión Ventas & Tienda</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" th:href="@{/clientes}">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/comerciales}">Comerciales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/fabricantes}">Fabricantes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor formulario con grid Bootstrap -->
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 800px;">
        <form th:action="@{/clientes/crear}" th:object="${cliente}" method="post">

            <!-- Cabecera en Grid -->
            <div class="row align-items-center py-3 border-bottom mb-4">
                <div class="col-8">
                    <h1 class="h3 mb-0 text-primary">Crear Cliente</h1>
                </div>
                <div class="col-4 text-end">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/clientes}" class="btn btn-secondary ms-1">Volver</a>
                </div>
            </div>

            <!-- Campos del formulario organizados con grid Bootstrap (row y col-sm-*) -->
            <div class="row mb-3 align-items-center">
                <label for="nombre" class="col-sm-3 col-form-label fw-bold">Nombre</label>
                <div class="col-sm-9">
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}" required="required" placeholder="Introduce el nombre"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="apellido1" class="col-sm-3 col-form-label fw-bold">Primer Apellido</label>
                <div class="col-sm-9">
                    <input type="text" id="apellido1" class="form-control" th:field="*{apellido1}" required="required" placeholder="Introduce el primer apellido"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="apellido2" class="col-sm-3 col-form-label fw-bold">Segundo Apellido</label>
                <div class="col-sm-9">
                    <input type="text" id="apellido2" class="form-control" th:field="*{apellido2}" placeholder="Introduce el segundo apellido (opcional)"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="ciudad" class="col-sm-3 col-form-label fw-bold">Ciudad</label>
                <div class="col-sm-9">
                    <input type="text" id="ciudad" class="form-control" th:field="*{ciudad}" placeholder="Introduce la ciudad"/>
                </div>
            </div>

            <div class="row mb-4 align-items-center">
                <label for="categoria" class="col-sm-3 col-form-label fw-bold">Categoría</label>
                <div class="col-sm-9">
                    <input type="number" id="categoria" class="form-control" th:field="*{categoria}" placeholder="Introduce la categoría (número entero)"/>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-9 offset-sm-3">
                    <button type="submit" class="btn btn-primary px-4">Guardar</button>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                </div>
            </div>

        </form>
    </div>

</body>
</html>
